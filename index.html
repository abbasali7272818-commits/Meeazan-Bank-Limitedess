  <script>
    // Safeguard to prevent "TypeError: Cannot set property fetch of #<Window> which has only a getter"
    (function() {
      try {
        var originalFetch = window.fetch;
        var customFetch = originalFetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return customFetch; },
          set: function(val) { customFetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn('Unable to redefine window.fetch setter:', e);
      }
    })();

    // Safeguard to catch and suppress MetaMask or third-party extension failures in sandbox/iframe environments
    (function() {
      // 1. Intercept console.error to prevent extension-related errors from reaching AI Studio's listener
      var originalConsoleError = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        var errStr = args.map(function(arg) {
          if (!arg) return '';
          if (typeof arg === 'string') return arg;
          return arg.message || arg.stack || JSON.stringify(arg);
        }).join(' ');

        if (
          errStr.includes('MetaMask') || 
          errStr.includes('metamask') || 
          errStr.includes('ethereum') || 
          errStr.includes('Extension') || 
          errStr.includes('extension') ||
          errStr.includes('wallet')
        ) {
          // Suppress error completely, log as warning
          console.warn('Suppressed extension console error:', errStr);
          return;
        }
        originalConsoleError.apply(console, arguments);
      };

      // 2. Intercept window.onerror
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var err = event.error;
        var errStr = msg + (err ? ' ' + (err.message || err.stack || '') : '');
        
        if (
          errStr.includes('MetaMask') || 
          errStr.includes('metamask') || 
          errStr.includes('ethereum') || 
          errStr.includes('Extension') || 
          errStr.includes('extension') ||
          errStr.includes('wallet')
        ) {
          console.warn('Suppressed extension window error:', errStr);
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      // 3. Intercept unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var reasonStr = reason ? (reason.message || reason.stack || String(reason)) : '';
        
        if (
          reasonStr.includes('MetaMask') || 
          reasonStr.includes('metamask') || 
          reasonStr.includes('ethereum') || 
          reasonStr.includes('Extension') || 
          reasonStr.includes('extension') ||
          reasonStr.includes('wallet')
        ) {
          console.warn('Suppressed extension promise rejection:', reasonStr);
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    })();
  </script>
